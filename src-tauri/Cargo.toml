[package]
name = "contextwire"
version = "0.4.0"
description = "One window for every Claude Code console"
license = "MIT"
authors = ["Shwetank"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "contextwire_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
portable-pty = "0.9.0"
base64 = "0.23.1"
tiny_http = "0.12.0"
which = "8.0.6"
dirs = "7.0.0"
uuid = { version = "1.26.1", features = ["v4"] }
serde_yaml = "0.9.34"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications", "Foundation", "Win32_UI_Shell", "Win32_Security_Cryptography", "Win32_Foundation"] }
