# ContextWire roadmap - SINGLE SOURCE OF TRUTH for the watchtower.
# Edit this file to change status; the watchtower reads it live
# (python watchtower/server.py -> http://127.0.0.1:8766).
#
# Task schema:
#   id          P<phase>.<n>
#   title       short name
#   status      done | in_progress | pending | blocked
#   effort      1..5 story points (drives the % complete)
#   depends_on  list of task ids; unmet deps are shown as "blocked by"
#   why         plain-English reason it is pending/blocked, or what it needs
#   decision    id of an open decision (below) that gates the task (optional)
#   checks      automated proofs that a "done" claim is real (optional):
#                 {type: path, path: relative/file}
#                 {type: cmd,  run: "shell command"}   # exit 0 = pass, cwd = repo root
# Decision schema (open_decisions): id, title, why, blocks [task ids], default,
#   status  open | resolved | deferred   (resolved decisions block nothing)
#   outcome text recorded when resolved/deferred
#
# Feature backlog schema (features) - what the app does / will do:
#   id      F<n>
#   title   short name
#   source  official   (a feature of the official Claude desktop app, from
#                       code.claude.com/docs/en/desktop, captured 2026-10-01)
#           own        (ContextWire's own idea / the reason it exists)
#   area    sessions | status | notify | console | workspace | review | other
#   status  shipped | building | planned | idea | wont
#   task    roadmap task id that delivers it (optional; shown with its live status)
#   note    one line on what it means for ContextWire
#
# Status semantics in the UI:
#   done + all checks pass  -> VERIFIED
#   done + a check fails    -> CLAIMED (something is wrong, look at it)
#   pending with unmet deps -> BLOCKED BY <deps>
#   blocked                 -> needs a human decision/action (see why/decision)

project: ContextWire
tagline: One Windows app for every Claude Code console - chat-style sidebar, live terminals, status highlights and notifications
updated: 2026-10-01

open_decisions:
  - id: D1
    title: App shell
    status: resolved
    outcome: "Tauri 2 (Rust) + vanilla TypeScript + Vite; xterm.js for the console (owner chose Tauri over Electron 2026-10-01)"
    why: Electron is fastest for embedded terminals; Tauri is ~10x smaller but the PTY side is Rust.
    blocks: []
    default: Tauri
  - id: D2
    title: Console model
    status: resolved
    outcome: "Option A - every chat is a real claude CLI process in a PTY (ConPTY via portable-pty). A chat-bubble view (Agent SDK / stream-json) is a later optional upgrade (F30)."
    why: Full CLI fidelity on day one (slash commands, permission prompts, skills, TUI) vs a nicer but re-implemented chat UI.
    blocks: []
    default: real CLI in a PTY
  - id: D3
    title: How hooks reach the app
    status: resolved
    outcome: "Sessions started in-app get hooks via `claude --settings <json>` (no global config change) and `--session-id <uuid>` so the app knows the id up front. The hook command is the app exe itself (`ContextWire.exe --hook`) posting to a localhost endpoint with a per-install token. Global hooks in ~/.claude/settings.json are OPT-IN (Settings > Track external sessions)."
    why: Global hooks touch every Claude session on the machine; per-session --settings keeps the default footprint zero.
    blocks: []
    default: per-session --settings
  - id: D4
    title: Tray + autostart defaults
    status: resolved
    outcome: "Close-to-tray, single instance, autostart with Windows ON by default (owner accepted the suggestion 2026-10-01); both toggleable in Settings."
    why: Notifications only work while the app is running.
    blocks: []
    default: on

phases:
  - id: P0
    name: Foundation
    goal: Project skeleton, toolchain, plan, watchtower.
    tasks:
      - id: P0.1
        title: Rust toolchain on this machine (rustup stable, MSVC host)
        status: done
        effort: 1
        why: Installed 2026-10-01 (cargo 1.98.1). VS 2022 C++ tools and WebView2 were already present.
        checks:
          - {type: cmd, run: "cargo --version"}
      - id: P0.2
        title: Tauri 2 + vanilla-ts scaffold (create-tauri-app)
        status: done
        effort: 1
        checks:
          - {type: path, path: src-tauri/tauri.conf.json}
          - {type: path, path: src-tauri/Cargo.toml}
      - id: P0.3
        title: PLAN.md, CLAUDE.md, docs/changelog.md
        status: done
        effort: 1
        checks:
          - {type: path, path: PLAN.md}
          - {type: path, path: CLAUDE.md}
          - {type: path, path: docs/changelog.md}
      - id: P0.4
        title: Watchtower (roadmap.yaml + dashboard with Build and Features tabs)
        status: done
        effort: 2
        checks:
          - {type: path, path: watchtower/server.py}
          - {type: cmd, run: "python -m unittest discover -s watchtower/tests -q"}
      - id: P0.5
        title: git init + first commit
        status: done
        effort: 1
        checks:
          - {type: cmd, run: "git rev-parse --verify HEAD"}

  - id: P1
    name: Console core
    goal: Real claude consoles in tabs - spawn, type, resize, switch, close.
    tasks:
      - id: P1.1
        title: Rust PTY session manager (portable-pty / ConPTY) - spawn, write, resize, kill, output + exit events
        status: done
        effort: 4
        depends_on: [P0.2]
        checks:
          - {type: path, path: src-tauri/src/pty.rs}
          - {type: cmd, run: "cargo test --manifest-path src-tauri/Cargo.toml --quiet"}
      - id: P1.2
        title: xterm.js console pane (fit addon, one live terminal per session, hidden when not active)
        status: done
        effort: 3
        depends_on: [P1.1]
        checks:
          - {type: path, path: src/terminal.ts}
          - {type: cmd, run: "npx tsc --noEmit"}
      - id: P1.3
        title: Chat-style sidebar - sessions grouped by workspace, new/close/rename session
        status: done
        effort: 3
        depends_on: [P1.2]
        checks:
          - {type: path, path: src/sidebar.ts}
      - id: P1.4
        title: Release build produces a working exe
        status: done
        effort: 2
        why: "Release build 2026-10-01 (4 min, LTO); installed per-user via the NSIS installer and launched from Explorer with a clean environment - claude found, hooks fire through the installed exe."
        depends_on: [P1.3]
        checks:
          - {type: path, path: src-tauri/target/release/contextwire.exe}

  - id: P2
    name: Status wiring
    goal: Every session reports working / needs-you / done; the sidebar highlights like a chat app.
    tasks:
      - id: P2.1
        title: Hook client mode (`contextwire.exe --hook`) - reads hook JSON on stdin, posts to the app, never blocks Claude
        status: done
        effort: 2
        depends_on: [P1.1]
        checks:
          - {type: path, path: src-tauri/src/hook.rs}
      - id: P2.2
        title: Localhost hook endpoint with per-install token; emits status events to the UI
        status: done
        effort: 2
        depends_on: [P2.1]
        checks:
          - {type: path, path: src-tauri/src/hookserver.rs}
      - id: P2.3
        title: In-app sessions launched with --session-id + --settings hooks (SessionStart, UserPromptSubmit, PreToolUse, PostToolUse, Notification, Stop, SessionEnd)
        status: done
        effort: 2
        depends_on: [P2.2]
      - id: P2.4
        title: Sidebar status dots, unread counts, bold/red highlight, needs-you floats to top, cleared on open
        status: done
        effort: 3
        depends_on: [P2.3, P1.3]
      - id: P2.5
        title: End-to-end verification - a real claude session in the app goes working -> done and the row highlights
        status: done
        effort: 2
        depends_on: [P2.4]
        why: "Verified live 2026-10-01 with a real claude 2.1.286 session in the dev app: SessionStart -> ready, prompt -> working -> done with unread badge while unfocused, needs-you via the real hook client (51 ms), focus clears unread. A real permission prompt was not triggered (session was in auto mode)."

  - id: P3
    name: Notifications and tray
    goal: Know when a session needs you without looking at the app.
    tasks:
      - id: P3.1
        title: Windows toast on needs-you, and on done when the session is not in view
        status: done
        effort: 2
        why: "Verified 2026-10-01: both toasts (needs you / is done) found in the Windows notification database. Dev builds show them under PowerShell; the installed build uses the app identity."
        depends_on: [P2.4]
      - id: P3.2
        title: Taskbar flash (request_user_attention) on needs-you
        status: done
        effort: 1
        why: "request_user_attention on needs (critical) / done (informational) when the window is not focused. Not visually confirmed (taskbar flash is not capturable from a screenshot)."
        depends_on: [P2.4]
      - id: P3.3
        title: System tray icon with live counts tooltip, Show / Quit menu, close-to-tray
        status: done
        effort: 2
        why: "Close button hides to tray (process + consoles keep running), verified 2026-10-01. Tray icon/menu are created at startup; the tooltip counts and the Show/Quit menu were not clicked in testing."
        depends_on: [P1.4]
      - id: P3.4
        title: Single instance + autostart with Windows (toggle in Settings)
        status: done
        effort: 2
        why: "Verified 2026-10-01: relaunch while running shows the existing window (one process); release first run registered HKCU Run \"contextwire.exe --minimized\"."
        depends_on: [P3.3]
      - id: P3.5
        title: Clicking a toast opens that session
        status: pending
        effort: 2
        depends_on: [P3.1]
        why: tauri-plugin-notification on desktop has no click callback yet; needs a WinRT toast activation handler (windows crate) or a protocol-activation URL.

  - id: P4
    name: Workspaces and resume
    goal: Know every workspace root and every past session; resume anything in the right folder.
    tasks:
      - id: P4.1
        title: Workspace registry seeded from ~/.claude/projects (cwd read from transcripts) + add-folder picker
        status: done
        effort: 2
        depends_on: [P1.3]
        checks:
          - {type: path, path: src-tauri/src/workspaces.rs}
      - id: P4.2
        title: Restore open sessions after app restart (claude --resume <id> in the original cwd)
        status: done
        effort: 2
        depends_on: [P4.1, P2.3]
      - id: P4.3
        title: History browser - past sessions per workspace from transcripts, one-click resume
        status: done
        effort: 3
        depends_on: [P4.1]
      - id: P4.4
        title: Opt-in global hooks (track sessions started in plain terminals) + Adopt button
        status: in_progress
        effort: 3
        depends_on: [P2.2]
        why: "Install/remove logic unit-tested on temp files (preserves user hooks and key order, writes a backup). The Settings toggle has not been flipped against the real ~/.claude/settings.json yet - left for the owner."

  - id: P5
    name: Packaging and polish
    goal: Installable, nice to use daily.
    tasks:
      - id: P5.1
        title: NSIS installer (tauri build) and app icon
        status: done
        effort: 2
        why: "NSIS installer (1.76 MB) at src-tauri/target/release/bundle/nsis/, custom icon from assets/icon.png. Unsigned - SmartScreen may warn on other machines."
        depends_on: [P1.4]
        checks:
          - {type: path, path: src-tauri/target/release/bundle/nsis/ContextWire_0.1.0_x64-setup.exe}

      - id: P5.2
        title: Keyboard shortcuts (Ctrl+1..9 switch, Ctrl+N new, Ctrl+K search, Ctrl+Shift+U next unread)
        status: in_progress
        effort: 2
        why: "Done: Ctrl+Shift+N new, Ctrl+Shift+H history, Ctrl+Shift+U jump to next needs-you/unread. Pending: Ctrl+1..9, Ctrl+K. Plain Ctrl keys are left to Claude (Ctrl+H is backspace in terminals)."
        depends_on: [P2.4]
      - id: P5.3
        title: Search sessions by name / folder / last message
        status: done
        effort: 2
        why: "Sidebar search (name/folder/last activity) and History filter."
        depends_on: [P4.3]
      - id: P5.4
        title: Per-session last-activity preview line in the sidebar (last prompt / last Claude summary)
        status: pending
        effort: 2
        depends_on: [P2.4]

  - id: P6
    name: Upgrades from the official app
    goal: Pull in the best of the official Claude desktop app (see the Features tab, source = official).
    tasks:
      - id: P6.1
        title: Split view - two consoles side by side
        status: pending
        effort: 3
        depends_on: [P1.2]
      - id: P6.2
        title: Worktree isolation option when starting a session (claude --worktree)
        status: in_progress
        effort: 1
        why: "New session dialog passes --worktree; not exercised live yet."
        depends_on: [P1.3]
      - id: P6.3
        title: Diff pane - git diff of the session's folder, refreshed on Stop
        status: pending
        effort: 3
        depends_on: [P2.4]
      - id: P6.4
        title: Plain shell pane per session (second PTY in the session folder)
        status: pending
        effort: 2
        depends_on: [P1.1]
      - id: P6.5
        title: Chat-bubble view (Agent SDK / stream-json) as an alternative to the raw console
        status: pending
        effort: 5
        depends_on: [P2.4]
        why: Big job; only worth it after daily use shows the console view is limiting.

