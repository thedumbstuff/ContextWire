  - {id: F2, title: Chat-style sidebar grouped by workspace root, source: own, area: sessions, status: shipped, task: P1.3}
  - {id: F3, title: "Live status per session: working / needs you / done / idle / exited", source: own, area: status, status: shipped, task: P2.4, note: "Driven by Claude Code hooks, not screen scraping"}
  - {id: F4, title: Unread badges + highlight + needs-you floats to top, source: own, area: status, status: shipped, task: P2.4, note: "Like a chat app; cleared when you open the session"}
  - {id: F5, title: Windows toast + taskbar flash when a session needs you or finishes, source: own, area: notify, status: shipped, task: P3.1}
  - {id: F6, title: "Tray icon with counts, close-to-tray, autostart", source: own, area: notify, status: shipped, task: P3.3}
  - {id: F7, title: Restore open sessions after restart, source: own, area: sessions, status: shipped, task: P4.2}
  - {id: F8, title: History of past sessions across all workspaces + one-click resume, source: own, area: workspace, status: shipped, task: P4.3}
  - {id: F9, title: Track sessions started in plain terminals (opt-in global hooks) + adopt, source: own, area: status, status: building, task: P4.4, note: "The official app cannot see a running terminal session at all"}
  - {id: F10, title: Click a toast to jump to the session, source: own, area: notify, status: planned, task: P3.5}
