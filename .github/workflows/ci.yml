name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JS dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: UI tests (status machine)
        run: npm test

      - name: Build frontend (tauri needs dist/)
        run: npx vite build

      - name: Rust tests (ConPTY, hooks, settings, logs)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Watchtower tests
        run: |
          pip install pyyaml
          python -m unittest discover -s watchtower/tests -q

  bundle:
    # Builds the NSIS installer and keeps it as a downloadable artifact.
    runs-on: windows-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: ContextWire-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
