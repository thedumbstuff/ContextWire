name: Bug report
description: Something in ContextWire does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include roughly when it happened - the log is timestamped (UTC).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. New session in ...
        2. ...
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >
        Settings -> Troubleshooting -> Copy diagnostics, then paste here. It contains no
        prompts or conversation text, but it does include folder paths - edit them out if
        they are private.
      render: text
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      description: Output of `claude --version`
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
