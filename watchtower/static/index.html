<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ContextWire Watchtower</title>
<style>
:root {
  --bg: #0d1014; --panel: #151a21; --panel2: #1b212a; --line: #262e39;
  --text: #d9dee5; --muted: #8893a1; --faint: #5b6574;
  --verified: #3fb95f; --claimed: #f0524f; --in_progress: #e3a526;
  --ready: #4c9aff; --blocked_by_deps: #7b8594; --blocked: #a974f0;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
  --sans: system-ui, "Segoe UI", -apple-system, Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 var(--sans); }
a { color: var(--ready); }
.wrap { max-width: 1280px; margin: 0 auto; padding: 14px 16px 40px; }
header { display: grid; gap: 8px; margin-bottom: 12px; }
.title-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
h1 { font: 600 20px/1.2 var(--mono); margin: 0; letter-spacing: -0.02em; }
h1 span { color: var(--muted); font-weight: 400; }
.tagline { color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--muted); font-size: 12px; }
.meta b { color: var(--text); font-weight: 500; font-family: var(--mono); }
.overall { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
.bar { position: relative; height: 12px; background: var(--panel2); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; display: flex; }
.bar.big { height: 20px; }
.bar i { display: block; height: 100%; }
.bar .v { background: var(--verified); }
.bar .c { background: var(--claimed); }
.bar .p { background: var(--in_progress); opacity: .85; background-image: repeating-linear-gradient(45deg, transparent 0 4px, rgba(0,0,0,.18) 4px 8px); }
.nums { display: flex; flex-wrap: wrap; gap: 4px 14px; font-family: var(--mono); font-size: 12px; }
.nums span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }
.nums .nv::before { background: var(--verified); } .nums .nc::before { background: var(--claimed); } .nums .np::before { background: var(--in_progress); }
button { font: 500 12px var(--sans); color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button:disabled { opacity: .6; cursor: progress; }
.banner { border-radius: 4px; padding: 10px 12px; margin: 10px 0; font-weight: 500; }
.banner.claimed { background: rgba(240,82,79,.14); border: 1px solid var(--claimed); color: #ffb3b1; }
.banner.warn { background: rgba(227,165,38,.12); border: 1px solid var(--in_progress); color: #f3d38c; }
.banner.err { background: rgba(240,82,79,.14); border: 1px solid var(--claimed); color: #ffb3b1; font-family: var(--mono); }
.banner a { color: inherit; }
.banner ul { margin: 4px 0 0; padding-left: 18px; font-weight: 400; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; min-width: 0; }
.panel h2 { font: 600 11px var(--sans); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; display: flex; justify-content: space-between; }
.dec { padding: 7px 0; border-top: 1px solid var(--line); }
.dec:first-of-type { border-top: 0; padding-top: 0; }
.dec .h { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.dec .id, .tid { font-family: var(--mono); font-weight: 600; }
.dec .why { color: var(--muted); font-size: 12px; margin: 2px 0; }
.dec .def { font-size: 12px; } .dec .def em { color: var(--muted); font-style: normal; }
.dtag { font: 600 10px var(--sans); text-transform: uppercase; letter-spacing: .04em; border-radius: 99px; padding: 1px 7px; border: 1px solid; }
.dtag.deferred { color: var(--in_progress); border-color: var(--in_progress); }
.dtag.resolved { color: var(--verified); border-color: var(--verified); }
details.resolved { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 6px; }
details.resolved > summary { cursor: pointer; color: var(--muted); font-size: 12px; }
details.resolved > summary b { color: var(--verified); font-family: var(--mono); margin: 0 4px; }
details.resolved > summary span { font-family: var(--mono); font-size: 11px; }
details.resolved .dec { border-top: 0; padding: 6px 0 0 14px; }
.chips { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.chip { font: 11px var(--mono); padding: 1px 6px; border-radius: 3px; background: var(--panel2); border: 1px solid var(--line); color: var(--text); cursor: pointer; text-decoration: none; }
.chip.done { color: var(--verified); border-color: rgba(63,185,95,.4); }
.chip.unmet { color: #ffb3b1; border-color: rgba(240,82,79,.45); }
.next { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 3px 10px; align-items: baseline; }
.next .eff { color: var(--muted); font-family: var(--mono); font-size: 11px; }
.empty { color: var(--faint); font-style: italic; }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0 12px; position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 0; border-bottom: 1px solid var(--line); }
.fpill { font: 500 11px var(--sans); border-radius: 99px; padding: 4px 10px; border: 1px solid; background: transparent; }
.fpill.off { opacity: .35; text-decoration: line-through; }
.fpill b { font-family: var(--mono); margin-left: 4px; }
.toolbar input { flex: 1 1 180px; min-width: 0; background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 4px; padding: 6px 9px; font: 12px var(--sans); }
.toolbar input:focus { outline: 1px solid var(--ready); }
.phases { display: grid; grid-template-columns: repeat(auto-fill, minmax(560px, 1fr)); gap: 12px; }
.phase .ph { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; margin-bottom: 6px; }
.phase .ph h3 { margin: 0; font: 600 14px var(--sans); }
.phase .ph h3 .tid { color: var(--muted); margin-right: 6px; }
.phase .goal { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
.phase .pct { font: 12px var(--mono); color: var(--muted); text-align: right; }
.phase .pct b { color: var(--verified); font-weight: 600; }
.phase .bar { margin-bottom: 6px; }
.task { border-top: 1px solid var(--line); }
.task summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto auto; gap: 8px; align-items: baseline; padding: 5px 2px; }
.task summary::-webkit-details-marker { display: none; }
.task summary:hover { background: var(--panel2); }
.task .tt { min-width: 0; overflow-wrap: anywhere; }
.task .eff { font: 11px var(--mono); color: var(--muted); }
.task .ck { font: 10px var(--mono); color: var(--faint); margin-left: 6px; white-space: nowrap; }
.task .ck.bad { color: var(--claimed); }
.pill { font: 600 10px var(--sans); text-transform: uppercase; letter-spacing: .04em; border-radius: 99px; padding: 2px 8px; white-space: nowrap; color: #0d1014; }
.pill.verified { background: var(--verified); } .pill.claimed { background: var(--claimed); }
.pill.in_progress { background: var(--in_progress); } .pill.ready { background: var(--ready); }
.pill.blocked_by_deps { background: var(--blocked_by_deps); } .pill.blocked { background: var(--blocked); color: #fff; }
.task.flash summary { outline: 1px solid var(--ready); }
.detail { padding: 4px 4px 10px 52px; font-size: 12px; display: grid; gap: 5px; }
.detail .k { color: var(--muted); display: inline-block; min-width: 76px; }
.checks { display: grid; gap: 3px; margin-top: 2px; }
.check { display: grid; grid-template-columns: 38px 52px 1fr; gap: 6px; font-family: var(--mono); font-size: 11px; background: var(--bg); border: 1px solid var(--line); border-radius: 3px; padding: 4px 6px; min-width: 0; }
.check .st { font-weight: 700; }
.check.ok .st { color: var(--verified); } .check.bad .st { color: var(--claimed); } .check.nr .st { color: var(--faint); }
.check .tg { word-break: break-all; }
.check .dt { grid-column: 3; color: var(--muted); white-space: pre-wrap; word-break: break-word; max-height: 9em; overflow: auto; }
.check.bad .dt { color: #f3b3b1; }
.hidden { display: none !important; }
footer { color: var(--faint); font-size: 11px; margin-top: 18px; }
/* ---- features tab ---- */
.ft-sum { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; margin-bottom: 10px; }
.ft-sum h2 { font: 600 16px var(--mono); margin: 0; }
.fpill2 { font: 600 11px var(--mono); padding: 2px 8px; border-radius: 10px; border: 1px solid var(--line); cursor: pointer; user-select: none; }
.fpill2.off { opacity: .35; }
.fs-shipped { color: var(--verified); } .fs-building { color: var(--in_progress); } .fs-planned { color: var(--ready); }
.fs-idea { color: var(--muted); } .fs-wont { color: var(--faint); text-decoration: line-through; }
table.feat { width: 100%; border-collapse: collapse; font-size: 12px; }
table.feat th { text-align: left; font: 600 10px var(--sans); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 4px 6px; border-bottom: 1px solid var(--line); }
table.feat td { padding: 6px; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
table.feat td.id, table.feat td.st { font-family: var(--mono); white-space: nowrap; }
table.feat .note { color: var(--muted); font-size: 11px; margin-top: 2px; }
table.feat .mm { color: var(--claimed); font-weight: 700; }
.ft-grid { display: grid; gap: 12px; }
@media (max-width: 760px) { table.feat .opt { display: none; } }
/* ---- tabs ---- */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: -4px 0 12px; }
.tab { background: transparent; border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 7px 14px; color: var(--muted); font: 600 12px var(--sans); letter-spacing: .03em; }
.tab:hover { color: var(--text); border-color: var(--line); }
.tab.active { color: var(--text); border-bottom-color: var(--ready); }
.rs-head { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; margin-bottom: 10px; }
.rs-head h2 { font: 600 16px var(--mono); margin: 0; }
.rs-head .sub { color: var(--muted); font-size: 12px; }
.rs-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; align-items: start; }
.rs-side { display: grid; gap: 12px; }
.howto { font-size: 12px; color: var(--muted); display: grid; gap: 5px; }
.howto b { color: var(--text); font-weight: 600; }
.hint { color: var(--in_progress); font-size: 12px; }
table.sig { width: 100%; border-collapse: collapse; font-size: 12px; }
table.sig th { text-align: right; font: 600 10px var(--sans); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 4px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.sig th:first-child, table.sig td:first-child { text-align: left; }
table.sig td { text-align: right; padding: 5px 6px; border-bottom: 1px solid var(--line); font-family: var(--mono); white-space: nowrap; }
table.sig td.nm { font-family: var(--sans); font-weight: 600; white-space: normal; overflow-wrap: break-word; }
table.sig tr.srow { cursor: pointer; }
table.sig tr.srow:hover td { background: var(--panel2); }
table.sig tr.srow td.ic { border-radius: 0; }
table.sig tr.sdet td { text-align: left; white-space: normal; font-family: var(--sans); background: var(--bg); padding: 10px; }
.gpill { font: 700 10px var(--sans); border-radius: 99px; padding: 2px 8px; color: #0d1014; }
.gpill.pass { background: var(--verified); } .gpill.fail { background: var(--claimed); } .gpill.na { background: var(--blocked_by_deps); }
.caret { display: inline-block; width: 10px; color: var(--faint); }
.sdet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.chart h4 { margin: 0 0 4px; font: 600 11px var(--sans); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .ax { stroke: var(--line); stroke-width: 1; }
.chart .gate { stroke: var(--in_progress); stroke-dasharray: 3 3; stroke-width: 1; }
.chart .pos { fill: var(--verified); } .chart .neg { fill: var(--claimed); } .chart .thin { opacity: .35; }
.chart .ln { fill: none; stroke: var(--ready); stroke-width: 1.6; }
.chart .pt { fill: var(--ready); } .chart .pt.h { fill: var(--text); stroke: var(--ready); stroke-width: 2; }
.chart text { fill: var(--muted); font: 9px var(--mono); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; }
.kv span:nth-child(odd) { color: var(--muted); }
.kv span:nth-child(even) { font-family: var(--mono); overflow-wrap: anywhere; }
.reasons { margin: 4px 0 0; padding-left: 16px; font-size: 12px; }
.reasons.fail { color: #f3b3b1; } .reasons.pass { color: #a6e3b5; }
.qlist { display: grid; gap: 6px; font-size: 12px; margin-top: 8px; }
.qlist .qm { color: var(--muted); }
.qlist .qm b { color: var(--text); font-family: var(--mono); }
.qlist .qs { font-family: var(--mono); font-size: 11px; overflow-wrap: anywhere; }
@media (max-width: 900px) { .rs-grid { grid-template-columns: 1fr; } }
/* ---- ops tab (P6.2) ---- */
.killbar { background: #b3261e; color: #fff; border-radius: 6px; padding: 12px 14px; margin-bottom: 12px; font: 700 14px var(--sans); letter-spacing: .02em; }
.killbar pre { margin: 6px 0 0; font: 500 12px var(--mono); white-space: pre-wrap; word-break: break-word; }
.killbar small { font: 400 12px var(--sans); opacity: .9; }
.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; margin-bottom: 12px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--faint); border-radius: 6px; padding: 8px 10px; min-width: 0; }
.tile .lb { font: 600 10px var(--sans); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.tile .vl { font: 600 15px var(--mono); margin-top: 2px; overflow-wrap: anywhere; }
.tile .sb { font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
.tile.ok { border-left-color: var(--verified); } .tile.amber { border-left-color: var(--in_progress); } .tile.red { border-left-color: var(--claimed); }
.lvl { font: 700 10px var(--sans); border-radius: 99px; padding: 1px 7px; color: #0d1014; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
.lvl.ok { background: var(--verified); } .lvl.amber { background: var(--in_progress); } .lvl.red { background: var(--claimed); } .lvl.na { background: var(--blocked_by_deps); }
.alerts { margin: 0 0 12px; padding: 0; list-style: none; display: grid; gap: 4px; }
.alerts li { font-size: 12px; display: flex; gap: 8px; align-items: baseline; }
.alerts li > span:nth-child(2) { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.alerts .asince { color: var(--faint); font: 11px var(--mono); white-space: nowrap; }
.alerts .asrc { color: var(--muted); font-size: 11px; }
.ops-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 12px; align-items: start; }
.ops-col { display: grid; gap: 12px; min-width: 0; }
.step { border-top: 1px solid var(--line); }
.step:first-child { border-top: 0; }
.step summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto 70px; gap: 8px; align-items: center; padding: 5px 2px; }
.step summary::-webkit-details-marker { display: none; }
.step summary:hover { background: var(--panel2); }
.step .no { font: 11px var(--mono); color: var(--faint); text-align: right; }
.step .nm { font-weight: 600; overflow-wrap: anywhere; }
.step .sec { font: 11px var(--mono); color: var(--muted); text-align: right; }
.step .body { padding: 2px 4px 8px 32px; font-size: 12px; display: grid; gap: 4px; }
.step .body pre { margin: 0; font: 11px/1.4 var(--mono); color: var(--muted); white-space: pre-wrap; word-break: break-word; max-height: 14em; overflow: auto; }
.spill { font: 700 10px var(--sans); border-radius: 99px; padding: 2px 8px; color: #0d1014; text-transform: uppercase; white-space: nowrap; }
.spill.ok { background: var(--verified); } .spill.failed, .spill.unreadable, .spill.unknown { background: var(--claimed); }
.spill.halted { background: var(--blocked); color: #fff; } .spill.skipped { background: var(--blocked_by_deps); }
.durbar { height: 3px; background: var(--ready); border-radius: 2px; opacity: .55; margin-top: 3px; }
.hist { display: flex; gap: 3px; flex-wrap: wrap; }
.hist .hc { width: 38px; text-align: center; font: 10px var(--mono); color: var(--muted); }
.hist .hc i { display: block; height: 18px; border-radius: 3px; margin-bottom: 2px; background: var(--blocked_by_deps); }
.hist .hc i.ok { background: var(--verified); } .hist .hc i.failed, .hist .hc i.unreadable, .hist .hc i.unknown { background: var(--claimed); } .hist .hc i.halted { background: var(--blocked); }
.tstats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 8px; }
.tstats div { min-width: 0; }
.tstats .lb { font: 600 10px var(--sans); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.tstats .vl { font: 600 15px var(--mono); }
.hbar { display: grid; grid-template-columns: 48px minmax(0, 1fr) 62px; gap: 8px; align-items: center; font-size: 12px; margin: 4px 0; color: var(--muted); }
.hbar .track { position: relative; height: 10px; background: var(--panel2); border: 1px solid var(--line); border-radius: 3px; }
.hbar .fill { position: absolute; top: 0; bottom: 0; background: var(--ready); border-radius: 2px; }
.hbar .mid { position: absolute; top: -3px; bottom: -3px; left: 50%; width: 1px; background: var(--muted); }
.hbar .v { font-family: var(--mono); text-align: right; color: var(--text); }
.spark { position: relative; }
.spark svg { width: 100%; height: 56px; display: block; overflow: visible; cursor: crosshair; }
.spark .ln { fill: none; stroke: var(--ready); stroke-width: 1.6; vector-effect: non-scaling-stroke; }
.spark .ln.dn { stroke: var(--claimed); } .spark .ln.up { stroke: var(--verified); }
.spark .base { stroke: var(--faint); stroke-dasharray: 2 3; vector-effect: non-scaling-stroke; }
.spark .xh { stroke: var(--muted); stroke-width: 1; vector-effect: non-scaling-stroke; }
.spark .tip { position: absolute; top: -2px; transform: translate(-50%, -100%); background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; font: 11px var(--mono); white-space: nowrap; pointer-events: none; z-index: 3; }
.spark-h { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--muted); margin: 8px 0 2px; }
.spark-h b { color: var(--text); font-family: var(--mono); font-weight: 500; }
table.bt { width: 100%; border-collapse: collapse; font-size: 12px; }
table.bt th { text-align: right; font: 600 10px var(--sans); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 4px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.bt td { text-align: right; padding: 6px; border-bottom: 1px solid var(--line); font-family: var(--mono); white-space: nowrap; vertical-align: middle; }
table.bt th:first-child, table.bt td:first-child { text-align: left; white-space: normal; }
table.bt td.eq { width: 30%; min-width: 110px; }
table.bt td.eq .spark svg { height: 34px; }
.bt-name { font-family: var(--sans); font-weight: 600; overflow-wrap: anywhere; }
.bt-sub { font: 11px var(--sans); color: var(--muted); }
.phbadge { display: inline-block; margin-top: 3px; background: var(--in_progress); color: #0d1014; font: 800 10px var(--sans); letter-spacing: .05em; border-radius: 3px; padding: 2px 6px; text-transform: uppercase; }
.negv { color: #f3a3a1; } .posv { color: #9fe0b0; }
table.ord { width: 100%; border-collapse: collapse; font: 11px var(--mono); margin-top: 6px; }
table.ord td { padding: 2px 4px; border-bottom: 1px solid var(--line); text-align: right; }
table.ord td:first-child { text-align: left; }
@media (max-width: 900px) { .ops-grid { grid-template-columns: 1fr; } }
@media (max-width: 560px) { .tstats { grid-template-columns: repeat(2, minmax(0, 1fr)); } table.bt .opt { display: none; } .strip { grid-template-columns: 1fr 1fr; } }
details.ops-more { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 6px; }
details.ops-more > summary { cursor: pointer; color: var(--muted); font-size: 12px; }
details.ops-more > summary b { color: var(--text); font-family: var(--mono); margin: 0 4px; }
details.ops-more > summary span { font-family: var(--mono); font-size: 11px; }
@media (max-width: 560px) {
  table.sig .opt { display: none; }
  .sdet-grid { grid-template-columns: 1fr; }
  table.sig td, table.sig th { padding: 5px 3px; }
}
@media (max-width: 760px) {
  .grid2 { grid-template-columns: 1fr; }
  .phases { grid-template-columns: 1fr; }
  .overall { grid-template-columns: 1fr; }
  .task summary { grid-template-columns: 40px minmax(0, 1fr) auto; }
  .task summary .eff { display: none; }
  .detail { padding-left: 6px; }
  .check { grid-template-columns: 34px 1fr; }
  .check .ty { display: none; }
  .check .dt { grid-column: 1 / -1; }
}
</style>
</head>
<body>
<div class="wrap">
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="build">Build</button>
    <button class="tab" role="tab" data-tab="features">Features</button>
  </nav>
  <div id="tab-build" class="tabpane">
  <header>
    <div class="title-row">
      <h1 id="project">watchtower <span>loading...</span></h1>
      <span class="tagline" id="tagline"></span>
    </div>
    <div class="overall">
      <div>
        <div class="bar big" id="overallBar" title="verified / claimed / in progress, effort-weighted"></div>
        <div class="nums" id="overallNums" style="margin-top:5px"></div>
      </div>
      <button id="refreshBtn" title="Re-run every check now (bypasses the 60s cache)">Refresh checks</button>
    </div>
    <div class="meta" id="meta"></div>
  </header>

  <div id="errorBanner" class="banner err hidden"></div>
  <div id="claimedBanner" class="banner claimed hidden"></div>
  <div id="warnBanner" class="banner warn hidden"></div>

  <div class="grid2">
    <section class="panel"><h2><span>Open decisions</span><span id="decCount"></span></h2><div id="decisions"></div></section>
    <section class="panel"><h2><span>Next up - ready, nothing blocking</span><span id="nextCount"></span></h2><div id="nextUp"></div></section>
  </div>

  <div class="toolbar" id="toolbar">
    <span id="filterPills" style="display:contents"></span>
    <input id="q" type="search" placeholder="Filter tasks: id, title, why, check..." autocomplete="off">
  </div>

  <div class="phases" id="phases"></div>
  <footer id="footer"></footer>
  </div>
  <div id="tab-features" class="tabpane hidden"></div>
</div>

<script>
"use strict";
const STATUSES = [
  ["verified", "verified"], ["claimed", "claimed"], ["in_progress", "in progress"],
  ["ready", "ready"], ["blocked_by_deps", "blocked by deps"], ["blocked", "blocked"],
];
const LABEL = Object.fromEntries(STATUSES);
const AUTO_MS = 60000;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function load(key, dflt) { try { const v = localStorage.getItem(key); return v == null ? dflt : JSON.parse(v); } catch (e) { return dflt; } }
function save(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }

let hidden = new Set(load("wt.hidden", []));
let open = new Set(load("wt.open", []));
let state = null;
let busy = false;

function ago(iso) {
  if (!iso) return "-";
  const s = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return s + "s ago";
  if (s < 3600) return Math.round(s / 60) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
}
function local(iso) { return iso ? new Date(iso).toLocaleString() : "-"; }

function barHtml(p) {
  const v = p.pct_verified, c = Math.max(p.pct_claimed - p.pct_verified, 0), ip = p.pct_in_progress;
  return `<i class="v" style="width:${v}%"></i><i class="c" style="width:${c}%"></i><i class="p" style="width:${ip}%"></i>`;
}

function renderHeader(s) {
  document.title = `${s.project} watchtower - ${s.overall.pct_verified}% verified`;
  $("project").innerHTML = `${esc(s.project)} <span>watchtower</span>`;
  $("tagline").textContent = s.tagline || "";
  const o = s.overall;
  $("overallBar").innerHTML = barHtml(o);
  $("overallNums").innerHTML =
    `<span class="nv">verified ${o.pct_verified}%</span>` +
    `<span class="nc">claimed ${o.pct_claimed}%</span>` +
    `<span class="np">in progress ${o.pct_in_progress}%</span>` +
    `<span style="color:var(--muted)">${o.effort.verified}/${o.effort_total} pts verified - ${o.tasks_total} tasks</span>`;
  const g = s.git || {};
  const commit = g.available ? `<b>${esc(g.hash)}</b> ${esc(g.subject)} <span title="${esc(local(g.date))}">(${ago(g.date)})</span>` : `<b>none</b> ${esc(g.detail || "")}`;
  $("meta").innerHTML =
    `<span>last commit ${commit}</span>` +
    `<span>roadmap.yaml edited <b title="${esc(local(s.roadmap_mtime))}">${ago(s.roadmap_mtime)}</b></span>` +
    `<span>checks <b>${s.checks_enabled ? "on" : "OFF"}</b>, cache ${s.check_ttl_s}s</span>` +
    `<span>venv <b style="color:${s.venv_present ? "var(--verified)" : "var(--claimed)"}">${s.venv_present ? "present" : "missing"}</b></span>` +
    `<span>state built <b id="builtAgo" data-t="${esc(s.generated_at)}">${ago(s.generated_at)}</b></span>`;
}

function renderBanners(s) {
  const all = s.phases.flatMap((p) => p.tasks);
  const claimed = all.filter((t) => t.effective_status === "claimed");
  const cb = $("claimedBanner");
  if (claimed.length) {
    cb.innerHTML = `CLAIMED: ${claimed.length} task${claimed.length > 1 ? "s are" : " is"} marked done but a check fails. Nobody should build on these until fixed.<ul>` +
      claimed.map((t) => `<li><a href="#task-${esc(t.id)}" data-jump="${esc(t.id)}">${esc(t.id)}</a> ${esc(t.title)} - ` +
        t.checks.filter((c) => c.ok === false).map((c) => `${esc(c.type)} ${esc(c.target)}: ${esc(c.detail.split("\n")[0])}`).join("; ") + "</li>").join("") + "</ul>";
    cb.classList.remove("hidden");
  } else cb.classList.add("hidden");

  const warns = [];
  if (!s.checks_enabled) warns.push("Checks are disabled (--no-checks). Done tasks are shown as verified without proof.");
  if (s.problems && s.problems.length) warns.push("roadmap.yaml problems:<ul>" + s.problems.map((p) => `<li>${esc(p)}</li>`).join("") + "</ul>");
  const wb = $("warnBanner");
  wb.innerHTML = warns.join("<br>");
  wb.classList.toggle("hidden", !warns.length);
}

function chip(id, statusById) {
  const cls = statusById[id] === "done" ? "done" : "unmet";
  return `<a class="chip ${cls}" href="#task-${esc(id)}" data-jump="${esc(id)}" title="${cls === "done" ? "done" : "not done"}">${esc(id)}</a>`;
}

function renderPanels(s, statusById) {
  const resolved = s.resolved_decisions || [];
  $("decCount").textContent = s.decisions.length;
  const openHtml = s.decisions.length ? s.decisions.map((d) => `
    <div class="dec">
      <div class="h"><span class="id">${esc(d.id)}</span>${d.status === "deferred" ? `<span class="dtag deferred">deferred</span>` : ""}<b>${esc(d.title)}</b>
        <span class="chips">${d.blocks.map((b) => chip(b, statusById)).join("")}</span></div>
      <div class="why">${esc(d.why)}</div>
      ${d.outcome ? `<div class="def"><em>${d.status === "deferred" ? "status" : "outcome"}:</em> ${esc(d.outcome)}</div>` : ""}
      <div class="def"><em>default:</em> ${esc(d.default)}</div>
    </div>`).join("") : `<div class="empty">No open decisions.</div>`;
  const resolvedHtml = resolved.length ? `
    <details class="resolved"${open.has("__resolved") ? " open" : ""} data-id="__resolved">
      <summary>Resolved decisions <b>${resolved.length}</b> <span>${resolved.map((d) => esc(d.id)).join(", ")}</span></summary>
      ${resolved.map((d) => `
      <div class="dec">
        <div class="h"><span class="id">${esc(d.id)}</span><span class="dtag resolved">resolved</span><b>${esc(d.title)}</b></div>
        <div class="def"><em>outcome:</em> ${d.outcome ? esc(d.outcome) : `<span class="empty">not recorded</span>`}</div>
        ${d.blocks_declared.length ? `<div class="why">no longer blocks ${d.blocks_declared.map(esc).join(", ")}</div>` : ""}
      </div>`).join("")}
    </details>` : "";
  $("decisions").innerHTML = openHtml + resolvedHtml;

  $("nextCount").textContent = s.next_up.length;
  $("nextUp").innerHTML = s.next_up.length ? `<div class="next">` + s.next_up.map((t) =>
    `<a class="chip" href="#task-${esc(t.id)}" data-jump="${esc(t.id)}">${esc(t.id)}</a><span>${esc(t.title)}</span><span class="eff">${t.effort}pt</span>`).join("") + `</div>`
    : `<div class="empty">Nothing is ready. Everything pending waits on an unfinished task or a decision - finish the in-progress work first.</div>`;
}

function renderFilters(s) {
  const counts = s.overall.counts;
  $("filterPills").innerHTML = STATUSES.map(([k, label]) =>
    `<button class="fpill ${hidden.has(k) ? "off" : ""}" data-status="${k}" style="border-color:var(--${k});color:var(--${k})" title="show/hide ${label}">${label}<b>${counts[k] || 0}</b></button>`).join("");
}

function checkHtml(c) {
  const cls = c.ok === true ? "ok" : c.ok === false ? "bad" : "nr";
  const st = c.ok === true ? "PASS" : c.ok === false ? "FAIL" : "--";
  const when = c.ran ? ` title="ran ${esc(local(c.ran_at))}${c.cached ? " (cached)" : ""}"` : "";
  return `<div class="check ${cls}"${when}><span class="st">${st}</span><span class="ty">${esc(c.type)}</span><span class="tg">${esc(c.target)}</span><span class="dt">${esc(c.detail)}</span></div>`;
}

function taskHtml(t, statusById) {
  const cs = t.checks_summary;
  const ck = cs.total ? `<span class="ck ${cs.failed ? "bad" : ""}" title="checks passed/total">${cs.passed}/${cs.total}</span>` : "";
  const hay = [t.id, t.title, t.why, t.decision, t.decision_title, LABEL[t.effective_status], ...t.checks.map((c) => c.target + " " + c.detail)].join(" ").toLowerCase();
  const deps = t.depends_on.length ? t.depends_on.map((d) => chip(d, statusById)).join(" ") +
    (t.unmet_deps.length ? ` <span style="color:var(--muted)">- unmet: ${t.unmet_deps.map(esc).join(", ")}</span>` : ` <span style="color:var(--verified)">- all met</span>`) : `<span class="empty">none</span>`;
  return `<details class="task" id="task-${esc(t.id)}" data-id="${esc(t.id)}" data-status="${t.effective_status}" data-hay="${esc(hay)}"${open.has(t.id) ? " open" : ""}>
    <summary><span class="tid">${esc(t.id)}</span><span class="tt">${esc(t.title)}${ck}</span><span class="eff">${t.effort}pt</span><span class="pill ${t.effective_status}">${LABEL[t.effective_status]}</span></summary>
    <div class="detail">
      <div><span class="k">why</span>${t.why ? esc(t.why) : `<span class="empty">-</span>`}</div>
      <div><span class="k">declared</span><b>${esc(t.status)}</b></div>
      <div><span class="k">decision</span>${t.decision ? `<b>${esc(t.decision)}</b> ${esc(t.decision_title || "")}${t.decision_status && t.decision_status !== "open" ? ` <span class="dtag ${esc(t.decision_status)}">${esc(t.decision_status)}</span>` : ""}` :`<span class="empty">none</span>`}</div>
      <div><span class="k">depends on</span>${deps}</div>
      <div><span class="k">checks</span>${cs.total ? `${cs.passed} pass, ${cs.failed} fail, ${cs.not_run} not run` : `<span class="empty">none defined - add checks so a done claim can be verified</span>`}
        ${cs.total ? `<div class="checks">${t.checks.map(checkHtml).join("")}</div>` : ""}</div>
    </div>
  </details>`;
}

function renderPhases(s, statusById) {
  $("phases").innerHTML = s.phases.map((p) => {
    const pr = p.progress;
    return `<section class="panel phase" data-phase="${esc(p.id)}">
      <div class="ph"><h3><span class="tid">${esc(p.id)}</span>${esc(p.name)}</h3>
        <span class="pct"><b>${pr.pct_verified}%</b> verified${pr.pct_claimed > pr.pct_verified ? ` - <span style="color:var(--claimed)">${pr.pct_claimed}% claimed</span>` : ""}${pr.pct_in_progress ? ` - <span style="color:var(--in_progress)">${pr.pct_in_progress}% wip</span>` : ""} - ${pr.effort_total}pt</span>
        <div class="goal">${esc(p.goal)}</div></div>
      <div class="bar">${barHtml(pr)}</div>
      <div class="tasks">${p.tasks.map((t) => taskHtml(t, statusById)).join("")}</div>
      <div class="empty hidden" data-none>No tasks match the filters.</div>
    </section>`;
  }).join("");
}

function applyFilters() {
  const q = $("q").value.trim().toLowerCase();
  document.querySelectorAll(".phase").forEach((ph) => {
    let shown = 0;
    ph.querySelectorAll(".task").forEach((el) => {
      const ok = !hidden.has(el.dataset.status) && (!q || el.dataset.hay.includes(q));
      el.classList.toggle("hidden", !ok);
      if (ok) shown++;
    });
    ph.querySelector("[data-none]").classList.toggle("hidden", shown > 0);
  });
}

function render(s) {
  state = s;
  const statusById = {};
  s.phases.forEach((p) => p.tasks.forEach((t) => (statusById[t.id] = t.status)));
  renderHeader(s);
  renderBanners(s);
  renderPanels(s, statusById);
  renderFilters(s);
  renderPhases(s, statusById);
  applyFilters();
  $("footer").textContent = `Source of truth: roadmap.yaml (re-read every request). Auto-refresh every ${AUTO_MS / 1000}s. Generated ${local(s.generated_at)}.`;
}

async function fetchState(refresh) {
  if (busy) return;
  busy = true;
  const btn = $("refreshBtn");
  if (refresh) { btn.disabled = true; btn.textContent = "Running checks..."; }
  try {
    const r = await fetch("/api/state" + (refresh ? "?refresh=1" : ""), { cache: "no-store" });
    const body = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
    if (!r.ok || body.error) throw new Error(body.error || `HTTP ${r.status}`);
    $("errorBanner").classList.add("hidden");
    render(body);
  } catch (e) {
    const eb = $("errorBanner");
    eb.textContent = `Could not load state: ${e.message}${state ? " - showing the last good state." : ""}`;
    eb.classList.remove("hidden");
  } finally {
    busy = false;
    btn.disabled = false; btn.textContent = "Refresh checks";
  }
}

function jump(id) {
  const el = document.getElementById("task-" + id);
  if (!el) return;
  if (el.classList.contains("hidden")) { hidden.clear(); save("wt.hidden", []); $("q").value = ""; renderFilters(state); applyFilters(); }
  el.open = true; open.add(id); save("wt.open", [...open]);
  el.scrollIntoView({ behavior: "smooth", block: "center" });
  el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1500);
}

document.addEventListener("click", (e) => {
  const j = e.target.closest("[data-jump]");
  if (j) { e.preventDefault(); jump(j.dataset.jump); return; }
  const f = e.target.closest(".fpill");
  if (f) {
    const k = f.dataset.status;
    hidden.has(k) ? hidden.delete(k) : hidden.add(k);
    save("wt.hidden", [...hidden]);
    f.classList.toggle("off", hidden.has(k));
    applyFilters();
  }
});
document.addEventListener("toggle", (e) => {
  const d = e.target;
  if (!d.classList || !(d.classList.contains("task") || d.classList.contains("resolved"))) return;
  d.open ? open.add(d.dataset.id) : open.delete(d.dataset.id);
  save("wt.open", [...open]);
}, true);
$("q").addEventListener("input", applyFilters);
$("refreshBtn").addEventListener("click", () => fetchState(true));
setInterval(() => fetchState(false), AUTO_MS);
setInterval(() => { const b = $("builtAgo"); if (b) b.textContent = ago(b.dataset.t); }, 10000);
fetchState(false);
</script>
<script>
"use strict";
/* ---- tabs + Features tab. Reads features from /api/state. ---- */
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const load = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } };
  const FS = ["shipped", "building", "planned", "idea", "wont"];
  const TASK_LABEL = { verified: "verified", claimed: "CLAIMED", in_progress: "in progress", ready: "ready", blocked_by_deps: "blocked by deps", blocked: "blocked" };
  let tab = load("cw.tab", "build");
  const off = new Set(load("cw.ftOff", ["wont"]));
  let feat = null;

  function setTab(t) {
    tab = t === "features" ? t : "build";
    save("cw.tab", tab);
    document.querySelectorAll(".tab").forEach((b) => {
      const on = b.dataset.tab === tab;
      b.classList.toggle("active", on); b.setAttribute("aria-selected", on);
    });
    $("tab-build").classList.toggle("hidden", tab !== "build");
    $("tab-features").classList.toggle("hidden", tab !== "features");
    if (tab === "features") fetchFeatures();
  }

  function table(items) {
    if (!items.length) return `<div class="empty" style="color:var(--muted)">nothing matches the filter</div>`;
    return `<table class="feat"><thead><tr><th>id</th><th>feature</th><th>status</th><th class="opt">area</th><th class="opt">delivered by</th></tr></thead><tbody>` +
      items.map((i) => `<tr><td class="id">${esc(i.id)}</td>
        <td>${esc(i.title)}${i.note ? `<div class="note">${esc(i.note)}</div>` : ""}</td>
        <td class="st fs-${esc(i.status)}">${esc(i.status)}${i.mismatch ? ` <span class="mm" title="declared shipped but its task is not verified">!</span>` : ""}</td>
        <td class="opt">${esc(i.area)}</td>
        <td class="opt">${i.task ? `<a href="#" data-jumpbuild="${esc(i.task)}">${esc(i.task)}</a> <span style="color:var(--muted)">${esc(TASK_LABEL[i.task_status] || i.task_status || "")}</span>` : "-"}</td></tr>`).join("") +
      `</tbody></table>`;
  }

  function render() {
    const el = $("tab-features");
    if (!feat) { el.innerHTML = `<div class="empty">loading features...</div>`; return; }
    if (feat.error) { el.innerHTML = `<div class="banner err">${esc(feat.error)}</div>`; return; }
    const c = feat.counts;
    const pills = FS.map((s) => `<span class="fpill2 fs-${s}${off.has(s) ? " off" : ""}" data-fs="${s}">${s} ${c[s]}</span>`).join("");
    const shown = feat.items.filter((i) => !off.has(i.status));
    const mm = feat.mismatches.length ? `<div class="banner claimed">Declared shipped but the delivering task is not verified: ${feat.mismatches.map(esc).join(", ")}</div>` : "";
    const sec = (src, title, sub) => {
      const items = shown.filter((i) => i.source === src);
      const b = feat.by_source[src];
      return `<section class="panel"><h2><span>${title}</span><span>${b.shipped} shipped / ${b.building + b.planned} to build / ${b.idea} ideas</span></h2>
        <div style="color:var(--muted);font-size:12px;margin:-2px 0 8px">${sub}</div>${table(items)}</section>`;
    };
    el.innerHTML = `<div class="ft-sum"><h2>Feature backlog</h2>${pills}<span style="color:var(--muted);font-size:12px">click a status to hide/show it</span></div>${mm}
      <div class="ft-grid">
      ${sec("own", "ContextWire core", "What this app exists to do - status per session, notifications, one place for every console.")}
      ${sec("official", "From the official Claude desktop app", "Captured from code.claude.com/docs/en/desktop on 2026-10-01, for later upgrades. idea = not scheduled yet; planned = has a roadmap task.")}
      </div>`;
  }

  async function fetchFeatures() {
    try {
      const r = await fetch("/api/state", { cache: "no-store" });
      const s = await r.json();
      feat = s.error ? { error: s.error } : s.features;
    } catch (e) { feat = { error: String(e) }; }
    render();
  }

  document.addEventListener("click", (e) => {
    const t = e.target.closest(".tab");
    if (t) { setTab(t.dataset.tab); return; }
    const p = e.target.closest("[data-fs]");
    if (p) { const s = p.dataset.fs; off.has(s) ? off.delete(s) : off.add(s); save("cw.ftOff", [...off]); render(); return; }
    const j = e.target.closest("[data-jumpbuild]");
    if (j) { e.preventDefault(); setTab("build"); if (typeof jump === "function") setTimeout(() => jump(j.dataset.jumpbuild), 50); }
  });
  setInterval(() => { if (tab === "features") fetchFeatures(); }, 60000);
  setTab(tab);
})();
</script>
</body>
</html>
